<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M🔜 | MISSION SOON</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{ --blue:#2D8CFF; --black:#0A0A0A; }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Space Grotesk',sans-serif;}
  body{background:#fff;color:var(--black);display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:20px;}
  .container{max-width:800px;width:100%;}
  .logo{display:flex;align-items:center;justify-content:center;gap:25px;margin-bottom:30px;flex-wrap:wrap;}
  .m-mark{font-size:120px;font-weight:700;line-height:0.9;letter-spacing:-8px;position:relative;}
  .m-mark span{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);width:70%;height:35px;background:var(--black);clip-path:polygon(0 0,50% 100%,100% 0,100% 40%,50% 100%,0 40%);background:var(--black);}
  .m-inner{font-size:120px;font-weight:700;}
  .right{display:text-align:left;}
  .arrow{background:var(--blue);color:#fff;padding:6px 22px 6px 16px;border-radius:6px;display:inline-flex;align-items:center;gap:8px;font-size:18px;font-weight:500;position:relative;}
  .arrow::after{content:'';position:absolute;right:-18px;top:50%;transform:translateY(-50%);border-left:18px solid var(--blue);border-top:18px solid transparent;border-bottom:18px solid transparent;}
  .soon{font-size:64px;font-weight:700;color:var(--blue);letter-spacing:1px;margin-top:10px;line-height:1;}
  h1{font-size:22px;letter-spacing:4px;margin:25px 0 10px;color:#666;}
  p{color:#555;font-size:18px;margin-bottom:30px;}
  .btn{background:var(--black);color:#fff;padding:14px 32px;border-radius:100px;text-decoration:none;font-weight:700;display:inline-block;transition:0.2s;}
  .btn:hover{transform:scale(1.05);background:var(--blue);}
  .footer{margin-top:50px;color:#999;font-size:12px;letter-spacing:2px;}
</style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <!-- Beautiful M -->
      <div class="m-inner">M</div>
      <div class="right">
        <div class="arrow">Mission</div>
        <div class="soon">SOON</div>
      </div>
    </div>

    <h1>THE HEIST CREW</h1>
    <p>48-hour missions. We plan fast. We build fast. We ship.<br>
    Mastermind × Inside Man × Safecrackers</p>

    <a href="https://github.com/YOUR_USERNAME/m-soon" class="btn">JOIN THE MISSION 🔜</a>

    <div class="footer">M🔜 // EST. 2026 // JHB</div>
  </div>
</body>
</html>
